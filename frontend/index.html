<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>输入输出示例 · 前端</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>输入输出示例</h1>
    <p class="lead">这是独立的前端页面。输入内容后点发送，请求会发给后端 API，后端原样返回并显示在输出框。</p>

    <!-- 输入框面板：带飞入动画 -->
    <section class="panel panel--input">
      <label for="inputBox">输入框</label>
      <textarea id="inputBox" placeholder="在这里输入内容，例如：你好，后端！">你好，后端！</textarea>
      <button id="sendBtn">发送到后端（POST）</button>
    </section>

    <!-- 输出框面板：稍微延后飞入 -->
    <section class="panel panel--output">
      <label for="outputBox">输出框（后端返回的内容）</label>
      <textarea id="outputBox" readonly placeholder="后端返回的内容会显示在这里"></textarea>
      <p id="status" class="status"></p>
    </section>

    <p class="hint">后端 API 地址可在 <code>script.js</code> 顶部的 <code>API_URL</code> 修改；部署到服务器时改成服务器的地址即可。</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
